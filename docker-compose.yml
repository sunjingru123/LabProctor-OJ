services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: labproctor
      POSTGRES_USER: labproctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data, ./migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck: {test: [CMD-SHELL, pg_isready -U labproctor -d labproctor], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, yes]
    volumes: [redisdata:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
  server:
    build: {context: ., dockerfile: deploy/Dockerfile.server}
    environment:
      DATABASE_URL: postgres://labproctor:${POSTGRES_PASSWORD:-change-me}@postgres:5432/labproctor?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-replace-with-32-byte-secret}
      HTTP_ADDR: :8080
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.worker}
    environment:
      DATABASE_URL: postgres://labproctor:${POSTGRES_PASSWORD:-change-me}@postgres:5432/labproctor?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JUDGE_WORKERS: ${JUDGE_WORKERS:-2}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [default]
volumes: {pgdata: {}, redisdata: {}}
